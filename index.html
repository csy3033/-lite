rm .1s}.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #580b15}.cta.secondary{background:#f4dbab;color:#7d1921;border:1px solid #dfbf8b;box-shadow:none}.cta.slim{padding:10px;font-size:14px}.muted{font-size:12px;color:#805e4f}.route{position:relative;padding:18px 8px 5px}.route:before{content:"";position:absolute;left:41px;top:33px;bottom:43px;border-left:3px dashed #d0a14f}.stop{display:flex;align-items:center;gap:14px;position:relative;margin:0 0 18px;min-height:75px}.medal{width:67px;height:67px;flex-shrink:0;border:3px solid #ffda83;border-radius:50%;background:#a11a25;display:grid;place-items:center;color:#fff4cb;font-size:28px;box-shadow:0 3px 9px #63171e40}.stop.locked .medal{background:#97806c;border-color:#cebfa3;filter:grayscale(.75)}.stop.done .medal{background:#9b6a14}.stop-name{font-weight:900;font-size:17px}.stop-sub{font-size:12px;margin-top:4px;color:#85665a}.lock-icon{margin-left:auto;font-size:21px}.scoreline{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#895b45;margin-bottom:14px}.progress{height:9px;background:#efd5ae;border-radius:10px;overflow:hidden;margin-bottom:16px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#a91a24,#e4aa32);transition:width .3s}.question{font-size:19px;font-weight:900;line-height:1.65;margin:12px 0 19px}.choice{display:flex;align-items:center;gap:12px;width:100%;border:2px solid #e5c9a3;background:#fffdf7;border-radius:13px;padding:13px 11px;margin:10px 0;text-align:left;color:#562b23;line-height:1.6;font-size:14px;min-height:58px}.choice .letter{display:inline-grid;place-items:center;min-width:30px;height:30px;background:#f1ddbd;color:#a01b22;border-radius:9px;font-weight:900}.choice:hover{border-color:#b72e36;background:#fff4e4}.choice:active{transform:scale(.99)}.ribbon{font-size:13px;background:#f6d78b;border-radius:10px;padding:10px 12px;color:#782b23;margin-bottom:14px}.explain-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.result-mark{width:58px;height:58px;background:#9a2029;color:white;border-radius:50%;display:grid;place-items:center;font-size:30px;flex-shrink:0}.result-mark.good{background:#47683d}.answer{background:#fff;border-left:5px solid #bd3031;padding:14px;border-radius:5px 13px 13px 5px;margin:13px 0}.answer strong{display:block;color:#a41d28;font-size:19px;margin-bottom:3px}.ref{border-top:1px dashed #d7b785;padding-top:14px;margin-top:13px}.ref h3{font-size:14px;margin:0 0 6px;color:#a52026}.ref p{margin:4px 0;font-size:13px;line-height:1.85}.quote{border-radius:13px;background:#f4ddb2;padding:15px;line-height:1.9;color:#70321e;font-size:14px;margin-bottom:14px}.stars{font-size:39px;text-align:center;letter-spacing:10px;color:#c38b28}.tiny{font-size:11px;line-height:1.7;color:#876b58}.time-screen{position:relative;min-height:100dvh;background:radial-gradient(circle at 50% 42%,#fbe099 0,#b71a27 35%,#3e0712 85%);color:#ffefbf;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:25px;text-align:center}.time-screen h2{font-size:30px;margin:5px}.time-screen .year{font-size:clamp(55px,17vw,85px);font-weight:1000;text-shadow:0 0 30px #fff3a0}.year.old{animation:oldyear 4.5s forwards}.year.new{animation:newyear 4.5s forwards}.tunnel{width:230px;height:230px;border:4px solid #ffda78;border-radius:50%;box-shadow:0 0 0 16px #f4b63e28,0 0 0 32px #f4b63e1e,0 0 50px #ffdb7d;animation:pulse 1.4s ease-in-out infinite;display:grid;place-items:center;margin:32px 0}.tunnel-inner{font-size:55px;animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 24px #f4b63e18,0 0 0 48px #f4b63e12,0 0 65px #ffdb7d}}@keyframes oldyear{0%,25%{opacity:1}55%,100%{opacity:0;transform:translateY(-35px)}}@keyframes newyear{0%,45%{opacity:0;transform:translateY(35px)}75%,100%{opacity:1;transform:translateY(0)}}.time-text{font-size:16px;line-height:2;max-width:350px}.skip{position:absolute;right:18px;top:18px;background:#7a101f;border:1px solid #ffdc8b;color:#fff2d6;border-radius:18px;padding:8px 13px}.confetti{position:absolute;width:5px;height:20px;background:#ffd76d;top:-10vh;animation:fall 3s linear infinite;opacity:.7}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}.certificate{text-align:center;border:3px double #bd7b28;background:linear-gradient(135deg,#fff7e6,#f7e3b6);padding:22px 15px;border-radius:12px;margin:12px 0}.certificate h2{font-size:29px;color:#a11c24}.certificate .bigstar{font-size:65px;color:#b88a30}.year-line{font-weight:800;font-size:17px;color:#9a1f27;margin:12px}.footer{text-align:center;font-size:11px;color:#744f46;padding:0 20px 24px;line-height:1.9}.homebar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}.back{border:0;background:none;color:#8d2324;font-weight:700;padding:6px}.badge{background:#a31f2a;color:#fff7d8;padding:5px 10px;border-radius:20px;font-size:12px}.flag-icon{display:inline-block;transform:rotate(-7deg);margin-right:5px}.footnote{font-size:11px;color:#795d4d;line-height:1.7}.footnote a{overflow-wrap:anywhere}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body><div id="app"></div><script>
const SPEECH='https://www.gov.cn/xinwen/2016-10/21/content_5122971.htm';
const bank=[["1921年7月23日，中国共产党第一次全国代表大会在上海法租界开幕，宣告了中国共产党的成立。这次大会后期转移至下列哪地继续举行？", ["天津", "广州", "嘉兴南湖", "武汉"], 2, "由于受到法租界巡捕的干扰，中共一大最后转移至浙江嘉兴南湖的一艘游船上继续举行。大会的召开标志着中国共产党正式成立。"], ["1922年7月，中国共产党在上海召开全国代表大会，第一次明确提出反帝反封建的民主革命纲领，并通过了党的历史上第一部党章。这次大会是？", ["中共二大", "中共三大", "中共四大", "中共五大"], 0, "中共二大制定了党的最高纲领和最低纲领，第一次明确提出反帝反封建的民主革命纲领，并通过第一部党章，为中国革命指明了现阶段的奋斗目标。"], ["1923年6月，中国共产党在广州召开全国代表大会，决定共产党员以个人身份加入国民党，确立了第一次国共合作的方针。这次大会是？", ["中共二大", "中共三大", "中共四大", "中共五大"], 1, "中共三大决定共产党员以个人身份加入国民党，同时保持共产党在政治、思想和组织上的独立性，为第一次国共合作的正式建立奠定了基础。"], ["1925年1月，中国共产党在上海召开全国代表大会，首次明确提出无产阶级在民主革命中的领导权问题和工农联盟问题。这次大会是？", ["中共一大", "中共二大", "中共三大", "中共四大"], 3, "中共四大总结国共合作以来的经验，明确提出无产阶级在民主革命中的领导权和工农联盟问题，进一步发展了党的民主革命理论。"], ["1927年8月1日，周恩来、贺龙、叶挺、朱德等领导发动武装起义，打响了武装反抗国民党反动派的第一枪。这次起义是？", ["秋收起义", "广州起义", "南昌起义", "湘南起义"], 2, "南昌起义标志着中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端。8月1日后来被确定为中国人民解放军建军纪念日。"], ["1927年8月7日，中共中央在汉口召开紧急会议，确立土地革命和武装反抗国民党反动派的方针，毛泽东提出“须知政权是由枪杆子中取得的”。这次会议是？", ["八七会议", "古田会议", "遵义会议", "瓦窑堡会议"], 0, "八七会议纠正了陈独秀的右倾机会主义错误，确定土地革命和武装反抗国民党反动派的总方针，为处于危急关头的中国革命指明了新的方向。"], ["1927年9月，毛泽东率湘赣边界秋收起义部队在江西永新进行改编，从组织上确立了党对军队领导的重要原则。这次改编是？", ["古田改编", "井冈山改编", "延安改编", "三湾改编"], 3, "三湾改编实行支部建在连上、建立士兵委员会等制度，为建设新型人民军队奠定了重要基础。"], ["1927年10月，毛泽东率工农革命军到达罗霄山脉中段，开始创建中国共产党领导的第一个农村革命根据地。这一根据地是？", ["中央革命根据地", "井冈山革命根据地", "鄂豫皖革命根据地", "川陕革命根据地"], 1, "井冈山革命根据地的建立，为探索农村包围城市、武装夺取政权的中国革命新道路提供了重要实践经验。"], ["1929年12月，中国共产党红军第四军第九次代表大会在福建上杭召开，确立思想建党、政治建军的原则。这次会议是？", ["古田会议", "三湾会议", "黎平会议", "遵义会议"], 0, "古田会议通过了古田会议决议，确立思想建党、政治建军的原则，强调用无产阶级思想建设党和人民军队，对人民军队建设具有深远影响。"], ["1930年5月，一位革命领袖撰写《反对本本主义》，提出“没有调查，没有发言权”的著名论断。这篇文章的作者是？", ["周恩来", "朱德", "毛泽东", "陈独秀"], 2, "毛泽东在《反对本本主义》中强调深入实际开展调查研究，反对脱离中国革命实际的教条主义，为实事求是思想路线的形成奠定了重要基础。"], ["1931年11月，中华苏维埃第一次全国代表大会召开，宣告中华苏维埃共和国临时中央政府成立。会议召开地点是？", ["井冈山", "瑞金", "延安", "遵义"], 1, "会议在江西瑞金召开，毛泽东当选中央执行委员会主席。这是中国共产党领导创建全国性工农民主政权的重要实践。"], ["1934年10月，由于第五次反“围剿”失利，中央红军主力被迫实行战略转移，开始了举世闻名的二万五千里征程。这一历史事件是？", ["北伐战争", "抗日战争", "解放战争", "红军长征"], 3, "中央红军于1934年10月开始战略转移。长征克服重重困难，保存了革命力量，实现了战略转移，并铸就了伟大的长征精神。"], ["1935年1月，中共中央政治局在长征途中召开扩大会议，事实上确立了毛泽东在党中央和红军的领导地位。这次会议是？", ["遵义会议", "八七会议", "古田会议", "洛川会议"], 0, "遵义会议集中解决当时具有决定意义的军事和组织问题，开启了党独立自主解决中国革命实际问题的新阶段，是党的历史上生死攸关的转折点。"], ["1935年12月，中共中央在陕北安定县召开政治局会议，确立建立抗日民族统一战线的策略方针。这次会议是？", ["洛川会议", "瓦窑堡会议", "遵义会议", "六届六中全会"], 1, "瓦窑堡会议分析国内外形势，确定建立广泛的抗日民族统一战线的策略方针，为全民族抗战和第二次国共合作奠定了政治基础。"], ["1936年10月，红一、红四方面军在甘肃何地胜利会师？此后红一、红二方面军在将台堡会师，标志着红军长征胜利结束。", ["陕北吴起镇", "甘肃哈达铺", "甘肃会宁", "陕北瓦窑堡"], 2, "红一、红四方面军在会宁会师，红一、红二方面军随后在将台堡（今宁夏西吉县）会师。三大主力先后会师标志着红军长征胜利结束。"], ["1936年12月12日，张学良、杨虎城在西安发动“兵谏”，扣留蒋介石，逼蒋联共抗日。这一历史事件是？", ["九一八事变", "卢沟桥事变", "华北事变", "西安事变"], 3, "中国共产党从民族利益出发，推动西安事变和平解决，促进了第二次国共合作，为抗日民族统一战线的建立创造了重要条件。"], ["1937年7月7日，日军在北平西南宛平附近挑衅，中国守军奋起抵抗，全民族抗战由此爆发。这一历史事件是？", ["九一八事变", "一二八事变", "卢沟桥事变（七七事变）", "八一三事变"], 2, "卢沟桥事变标志着日本全面侵华战争的开始，也是中国全民族抗战爆发的标志。1931年的九一八事变是中国人民抗日战争的起点。"], ["1937年8月，中共中央在陕北召开政治局扩大会议，通过《抗日救国十大纲领》，确定全面抗战路线。这次会议是？", ["洛川会议", "遵义会议", "瓦窑堡会议", "六届六中全会"], 0, "洛川会议明确全面抗战路线，强调广泛发动和组织人民群众，坚持独立自主的敌后游击战争，为党领导抗日战争制定了重要方针。"], ["1937年9月，八路军第115师在山西某地取得全民族抗战以来中国军队主动对日作战的第一个重大胜利。这次战役是？", ["台儿庄战役", "平型关大捷", "百团大战", "忻口战役"], 1, "平型关大捷打破了日军不可战胜的神话，极大地鼓舞了全国军民的抗战信心。"], ["1938年，毛泽东发表重要军事著作，科学预见抗日战争将经历战略防御、战略相持、战略反攻三个阶段。这篇著作是？", ["《论联合政府》", "《新民主主义论》", "《实践论》", "《论持久战》"], 3, "《论持久战》科学分析中日双方的基本特点，批驳“亡国论”和“速胜论”，指出抗日战争的三个战略阶段，论证了中国必将取得最终胜利。"], ["1940年8月起，八路军总部在华北发动大规模进攻战役，沉重打击了日军的“囚笼政策”。这次战役是？", ["百团大战", "平型关大捷", "忻口战役", "徐州会战"], 0, "百团大战是八路军在华北敌后发动的大规模进攻战役，沉重打击了日军的“囚笼政策”，增强了全国人民坚持抗战的信心。"], ["1938年9月至11月，中国共产党在延安召开重要会议，毛泽东首次鲜明提出“马克思主义中国化”的命题。这次会议是？", ["遵义会议", "洛川会议", "中共六届六中全会", "中共七大"], 2, "毛泽东在六届六中全会上所作的《论新阶段》政治报告中，明确提出马克思主义中国化的命题，强调将马克思主义基本原理同中国具体实际相结合。"], ["1942年起，中国共产党在全党范围开展马克思主义思想教育运动，主要任务是反对主观主义、宗派主义和党八股。这场运动是？", ["土地改革运动", "大生产运动", "三反五反运动", "延安整风运动"], 3, "延安整风运动使全党在思想上、政治上和组织上达到新的团结和统一，为中共七大的召开奠定了思想基础。"], ["1945年4月至6月，中共七大在延安杨家岭召开，将毛泽东思想确立为党的指导思想并写入党章。这次大会被称为？", ["开天辟地的大会", "团结的大会、胜利的大会", "里程碑的大会", "拨乱反正的大会"], 1, "中共七大制定了党的政治路线，实现了全党空前的团结和统一，为夺取抗日战争和新民主主义革命的胜利作了重要准备。"], ["1945年8月底至10月，毛泽东亲赴某地同国民党当局进行和平谈判，双方签订《双十协定》。这次谈判是？", ["西安谈判", "北平谈判", "重庆谈判", "南京谈判"], 2, "1945年8月28日，毛泽东、周恩来、王若飞赴重庆谈判。10月10日，双方签订《政府与中共代表会谈纪要》，体现了中国共产党争取和平、民主的诚意。"], ["1946年6月，国民党军队大举进攻某解放区，全面内战由此爆发。这一历史事件是？", ["国民党军队大举进攻中原解放区", "四一二反革命政变", "皖南事变", "一二·一运动"], 0, "国民党当局撕毁和平协议，大举进攻中原解放区。中国共产党领导人民军队进行自卫作战，逐步粉碎国民党军队的全面进攻和重点进攻。"], ["1947年8月，刘伯承、邓小平率晋冀鲁豫野战军主力实施重大军事行动，将战争引向国民党统治区域，成为人民解放军战略进攻的重要标志。这一行动是？", ["挺进豫西", "攻克济南", "渡江战役", "千里跃进大别山"], 3, "刘邓大军于1947年6月底强渡黄河，发起鲁西南战役，揭开战略进攻序幕；8月千里跃进大别山，推动人民解放战争由战略防御转向战略进攻。"], ["1948年9月至1949年1月，人民解放军先后发动三次战略决战，基本消灭了国民党军队主力。这三次战役是？", ["渡江、上海、福州战役", "辽沈、淮海、平津战役", "济南、太原、兰州战役", "淮海、渡江、上海战役"], 1, "辽沈、淮海、平津三大战役改变了国共双方的军事力量对比，为解放全国奠定了决定性基础。"], ["1949年4月，人民解放军横渡长江，解放南京，宣告国民党在中国大陆的反动统治覆灭。这次战役是？", ["渡江战役", "淮海战役", "平津战役", "上海战役"], 0, "1949年4月，人民解放军发起渡江战役，并于4月23日解放南京，为解放全国广大地区创造了有利条件。"], ["1949年3月，中共七届二中全会在河北平山西柏坡召开，毛泽东提出“两个务必”。这次会议着重讨论的是？", ["土地改革问题", "抗美援朝问题", "党的工作重心由乡村转移到城市的问题", "社会主义改造问题"], 2, "七届二中全会提出党的工作重心由乡村转移到城市，强调恢复和发展生产，并要求全党保持谦虚谨慎、不骄不躁和艰苦奋斗的作风。"], ["1949年10月1日，毛泽东在天安门城楼上庄严宣告中华人民共和国中央人民政府成立。这一历史事件是？", ["政协开幕", "开国大典", "渡江战役胜利", "北平和平解放"], 1, "中华人民共和国的成立标志着中国新民主主义革命取得基本胜利，开启了中国历史的新纪元。"], ["1950年10月，中国人民志愿军跨过鸭绿江，开始保家卫国的斗争。这场战争是？", ["解放战争", "对越自卫反击战", "中印边境自卫反击战", "抗美援朝战争"], 3, "1950年10月，中国人民志愿军赴朝作战。1953年7月，朝鲜停战协定签订。抗美援朝战争维护了新中国的安全，提高了新中国的国际地位。"], ["1953年，党正式提出过渡时期总路线，其核心可概括为“一化三改”。“一化”指的是？", ["农业机械化", "国防现代化", "国家的社会主义工业化", "科技现代化"], 2, "“一化”指逐步实现国家的社会主义工业化，“三改”指逐步实现对农业、手工业和资本主义工商业的社会主义改造，体现了社会主义建设和改造同时并举的方针。"], ["1953—1956年，我国对农业、手工业和资本主义工商业进行社会主义改造。这场改造史称？", ["三大改造", "土地改革", "大跃进", "整风运动"], 0, "到1956年底，三大改造基本完成，实现了生产资料私有制向社会主义公有制的转变，标志着社会主义基本制度在我国建立。"], ["1954年9月，第一届全国人民代表大会第一次会议在北京召开，通过我国第一部社会主义类型的宪法。这部宪法是？", ["《共同纲领》", "《中华苏维埃共和国宪法大纲》", "《陕甘宁边区施政纲领》", "《中华人民共和国宪法》（1954年）"], 3, "1954年宪法确立了人民代表大会制度等国家基本制度，为社会主义建设提供了重要法律保障。"], ["1956年9月，中国共产党全国代表大会在北京召开，正确分析国内主要矛盾，确定主要任务是集中力量发展社会生产力。这次大会是？", ["中共七大", "中共八大", "中共九大", "中共十大"], 1, "中共八大正确分析了国内社会主要矛盾的变化，指出党和人民的主要任务是发展社会生产力，为探索适合中国国情的社会主义建设道路作出了重要贡献。"], ["1964年10月16日，我国在国防科技领域取得重要突破，打破了当时的核垄断。这一历史事件是？", ["第一颗氢弹爆炸成功", "第一颗人造卫星发射成功", "第一颗原子弹爆炸成功", "第一艘核潜艇下水"], 2, "我国第一颗原子弹于1964年10月16日爆炸成功，增强了我国的国防实力，提高了我国的国际地位，是新中国国防科技事业的重要里程碑。"], ["1970年4月24日，我国成功发射第一颗人造地球卫星。这颗卫星是？", ["东方红一号", "神舟一号", "嫦娥一号", "风云一号"], 0, "东方红一号成功发射，使中国成为世界上第五个独立研制并发射人造地球卫星的国家。2016年起，每年4月24日被设立为中国航天日。"], ["1978年5月11日，《光明日报》发表特约评论员文章，引发全国范围的思想解放大讨论。这篇文章是？", ["《解放思想，实事求是，团结一致向前看》", "《实践是检验真理的唯一标准》", "《论十大关系》", "《关于建国以来党的若干历史问题的决议》"], 1, "这篇文章引发关于真理标准问题的大讨论，冲破“两个凡是”的思想束缚，为党的十一届三中全会召开奠定了重要思想基础。"], ["1978年12月，中共中央召开会议，作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策。这次会议是？", ["中共十一大", "中共十二大", "十二届三中全会", "十一届三中全会"], 3, "十一届三中全会重新确立解放思想、实事求是的思想路线，开启了改革开放和社会主义现代化建设的新时期。"], ["1980年，我国开始试办经济特区。下列不属于第一批经济特区的是？", ["海南", "深圳", "珠海", "厦门"], 0, "1980年，我国设立深圳、珠海、汕头和厦门四个经济特区。1988年海南建省并设立经济特区，因此不属于第一批经济特区。"], ["1982年9月，邓小平在中国共产党全国代表大会开幕词中提出“走自己的道路，建设有中国特色的社会主义”。这次大会是？", ["中共十大", "中共十一大", "中共十二大", "中共十三大"], 2, "中共十二大强调把马克思主义的普遍真理同我国的具体实际结合起来，为中国特色社会主义事业的发展指明了方向。"], ["1987年10月，中国共产党全国代表大会系统阐述社会主义初级阶段理论，制定“三步走”发展战略。这次大会是？", ["中共十二大", "中共十三大", "中共十四大", "中共十五大"], 1, "中共十三大系统阐述社会主义初级阶段理论，明确党在社会主义初级阶段的基本路线，提出实现社会主义现代化的“三步走”发展战略。"], ["1992年初，邓小平先后视察武昌、深圳、珠海、上海等地并发表重要谈话。这些谈话史称？", ["北方谈话", "西方谈话", "东方谈话", "南方谈话"], 3, "南方谈话进一步回答了什么是社会主义、怎样建设社会主义等重大理论和实践问题，推动思想解放，促进改革开放进入新的发展阶段。"], ["1997年7月1日，中国政府对某地区恢复行使主权，该特别行政区正式成立。这一历史事件是？", ["香港回归", "澳门回归", "台湾光复", "港珠澳大桥通车"], 0, "香港回归是“一国两制”构想的成功实践，也是祖国统一大业的重要一步。澳门于1999年12月20日回归祖国。"], ["1997年9月，中国共产党全国代表大会把邓小平理论确立为党的指导思想并写入党章，提出党在社会主义初级阶段的基本纲领。这次大会是？", ["中共十三大", "中共十四大", "中共十五大", "中共十六大"], 2, "中共十五大确立邓小平理论的指导地位，提出社会主义初级阶段的基本纲领，进一步明确中国特色社会主义经济、政治和文化建设的目标与政策。"], ["2002年11月，中国共产党全国代表大会把“三个代表”重要思想确立为党必须长期坚持的指导思想，提出全面建设小康社会的奋斗目标。这次大会是？", ["中共十五大", "中共十七大", "中共十八大", "中共十六大"], 3, "中共十六大将“三个代表”重要思想写入党章，提出全面建设小康社会的奋斗目标，对新世纪新阶段中国特色社会主义事业作出全面部署。"], ["2012年11月，中国共产党全国代表大会把科学发展观确立为党的行动指南。这次大会是？", ["中共十七大", "中共十八大", "中共十九大", "中共二十大"], 1, "中共十八大将科学发展观确立为党的指导思想并写入党章，提出全面建成小康社会的奋斗目标，明确中国特色社会主义事业“五位一体”的总体布局。"], ["2017年10月，中国共产党全国代表大会作出中国特色社会主义进入新时代的重大政治判断，将习近平新时代中国特色社会主义思想确立为党的指导思想并写入党章。这次大会是？", ["中共十九大", "中共十八大", "中共二十大", "中共十七大"], 0, "中共十九大指出，中国特色社会主义进入新时代，我国社会主要矛盾转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。"], ["中国共产党第二十次全国代表大会明确提出以中国式现代化全面推进中华民族伟大复兴的中心任务。这次大会的召开时间是？", ["2021年10月", "2023年10月", "2024年10月", "2022年10月"], 3, "中共二十大于2022年10月16日至22日在北京召开，明确提出全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。"]];

function home(){state.scene='home';let stops=levels.map((l,i)=>{let locked=i>0&&!state.passed[i-1];return `<div class="stop ${locked?'locked':''} ${state.passed[i]?'done':''}"><div class="medal">${state.passed[i]?'★':locked?'⌁':['🚩','⚔','✦'][i]}</div><div><div class="stop-name">第${['一','二','三'][i]}关 · ${l.place}</div><div class="stop-sub">${l.name} ｜ ${state.passed[i]?'已通关':locked?'上一关合格后解锁':'可挑战'}</div></div><div class="lock-icon">${state.passed[i]?'✔':locked?'🔒':'➜'}</div></div>`}).join('');const next=state.passed.findIndex(p=>!p);shell(`<section class="sheet"><div class="eyebrow">长征精神互动学习 · H5 闯关</div><h2>踏上征途，传承精神</h2><div class="intro-copy"><p>欢迎来到长征精神理论学习答题闯关！今年是中国工农红军长征胜利90周年。九十载岁月流转，那段跨越万水千山的远征，早已化作镌刻在民族血脉里的精神丰碑。闯关途中，题目将带我们回望重大战役、读懂先辈抉择、领会长征精神的时代内涵。希望大家沉下心来、认真思考，在答题中学习、在挑战中感悟。准备好了吗，闯关挑战正式开启！</p></div><p>从50道党史知识题库随机抽取15道题，完成三段精神征途。每关5道题，每题20分，<strong>得分≥80分</strong>才能解锁下一关。</p><div class="ribbon">答题后进入独立解析页，展示正确答案与党史知识解析。</div><div class="route">${stops}</div>${next<0?'<button class="cta" onclick="beginTime()">★ 再次观看：穿越到2026年</button>':`<button class="cta" onclick="startLevel(${next})">${next===0?'开启闯关挑战':`进入第${['一','二','三'][next]}关`} →</button>`}<p class="tiny">温馨提示：历史路线仅作精神征途示意，非按实际地理位置绘制的路线图。单关答错两题或以上需重新挑战。</p></section>`)}
function startLevel(i){if(i>0&&!state.passed[i-1]){home();return}state.level=i;state.index=0;state.score=0;state.selected=null;state.attempts[i]++;question()}
function question(){state.scene='question';const l=levels[state.level],q=l.questions[state.index];shell(`<div class="homebar"><button class="back" onclick="home()">← 返回路线</button><span class="badge">${safe(l.place)}</span></div><section class="sheet"><div class="eyebrow">第${['一','二','三'][state.level]}关｜${safe(l.name)}</div><h2>${safe(l.spirit)}</h2><div class="scoreline"><span>第 ${state.index+1} / 5 题</span><span>当前 ${state.score} 分</span></div><div class="progress"><span style="width:${(state.index/5)*100}%"></span></div><div class="question">${safe(q[0])}</div>${q[1].map((o,j)=>`<button class="choice" onclick="choose(${j})"><span class="letter">${'ABCD'[j]}</span><span>${safe(o)}</span></button>`).join('')}<p class="footnote">选择后自动进入知识解析页，确认后继续下一题。</p></section>`)}
function choose(i){if(state.scene!=='question')return;state.selected=i;const q=levels[state.level].questions[state.index];if(i===q[2])state.score+=20;explanation()}
function explanation(){state.scene='explanation';const l=levels[state.level],q=l.questions[state.index],right=state.selected===q[2];shell(`<div class="homebar"><span class="badge">${safe(l.place)}</span><span class="muted">第${state.index+1}题 / 共5题</span></div><section class="sheet"><div class="explain-head"><div class="result-mark ${right?'good':''}">${right?'✓':'×'}</div><div><div class="eyebrow">${right?'回答正确 · 精神传承':'回答错误 · 知识补给'}</div><h2 style="margin:3px 0">${right?'继续前进！':'重温历史，再出发'}</h2></div></div><div class="answer"><span class="muted">正确答案</span><strong>${'ABCD'[q[2]]}. ${safe(q[1][q[2]])}</strong><span class="muted">${right?'你获得20分':'本题未得分，认真学习后继续'}</span></div><div class="ref"><h3>📜 党史知识解析</h3><p>${safe(q[3])}</p></div><button class="cta" onclick="nextQuestion()">${state.index===4?'查看本关成绩':'我已学习，继续前进 →'}</button></section>`)}
function nextQuestion(){if(state.scene!=='explanation')return;if(state.index<4){state.index++;state.selected=null;question()}else finishLevel()}
function finishLevel(){state.scene='result';const passed=state.score>=80;const l=levels[state.level];if(passed)state.passed[state.level]=true;const final=state.level===2&&passed;shell(`<section class="sheet" style="text-align:center"><div class="eyebrow">第${['一','二','三'][state.level]}关 · ${safe(l.place)}</div><div class="stars">${passed?'★★★':'★☆☆'}</div><h2>${passed?'闯关成功！':'这一关仍需努力'}</h2><div style="font-size:55px;font-weight:1000;color:#ad202a">${state.score}<small style="font-size:16px"> 分</small></div><p>${passed?'信念如炬，脚步不停。你已完成本关的党史知识学习。':'通关需要80分（至少答对4题）。回顾知识，再挑战一次！'}</p><div class="quote">“每一代人有每一代人的长征路，每一代人都要走好自己的长征路。”<div style="font-size:12px;margin-top:4px">——习近平，2016年10月21日</div></div>${final?'<button class="cta" onclick="beginTime()">开启时空之门：穿越到2026 →</button>':passed?`<button class="cta" onclick="startLevel(${state.level+1})">解锁下一关 →</button>`:`<button class="cta" onclick="startLevel(${state.level})">重新挑战本关</button>`}<div style="height:10px"></div><button class="cta secondary slim" onclick="home()">返回长征路线</button></section>`)}
function beginTime(){if(!state.passed.every(Boolean)){home();return}state.scene='time';const flakes=Array.from({length:24},(_,i)=>`<i class="confetti" style="left:${(i*37)%100}%;animation-delay:${(i%9)*.3}s;animation-duration:${2.2+(i%7)*.24}s"></i>`).join('');app.innerHTML=`<section class="time-screen">${flakes}<button class="skip" onclick="finalScreen()">跳过动画 →</button><div class="eyebrow" style="color:#ffe5a4">时空之门 · 长征胜利90周年</div><div style="position:relative;height:100px;width:100%"><div class="year old" style="position:absolute;inset:0">1936</div><div class="year new" style="position:absolute;inset:0">2026</div></div><div class="tunnel"><div class="tunnel-inner">★</div></div><h2>从胜利会师，到新的长征</h2><p class="time-text" id="timemsg">跨越九十年山河，<br>长征的精神从未褪色。</p><p style="font-size:12px;opacity:.8">历史照亮未来 · 我们接续前行</p></section>`;window.scrollTo(0,0);clearTimeout(state.animTimer);state.animTimer=setTimeout(finalScreen,4800)}
function finalScreen(){clearTimeout(state.animTimer);state.scene='final';shell(`<section class="sheet"><div class="certificate"><div class="eyebrow">1936—2026 · 长征胜利90周年</div><div class="bigstar">★</div><h2>长征精神传承者</h2><p>恭喜你完成三关长征精神知识挑战</p><div class="year-line">于都 · 遵义 · 赤水 · 泸定桥 · 会宁</div><p>穿越九十年，走好新时代的长征路</p><p class="tiny">坚定信念｜实事求是｜人民至上｜团结奋斗</p></div><div class="quote">“每一代人有每一代人的长征路，每一代人都要走好自己的长征路。”<div class="muted" style="margin-top:5px">——习近平</div></div><div class="intro-copy closing-copy"><p>恭喜各位闯关成功！回望征途，90年前红军将士踏过雪山草地，以信仰冲破重重险阻。闯关虽已落幕，但长征精神永不谢幕。答题不是终点，学习永不止步。每一代人都有属于自己的长征路，愿我们铭记历史、传承初心，把长征精神化为前行力量，在新征程上坚定信念、勇毅奋进，走好属于我们这一代人的长征路！</p></div><button class="cta" onclick="home()">查看我的长征路线</button><div style="height:12px"></div><button class="cta secondary" onclick="resetGame()">重新开启长征之旅</button></section>`)}
function resetGame(){if(!confirm('确定重置全部关卡成绩并重新开始吗？'))return;dealQuestions();state.passed=[false,false,false];state.attempts=[0,0,0];state.level=0;state.index=0;state.score=0;home()}
window.home=home;window.startLevel=startLevel;window.choose=choose;window.nextQuestion=nextQuestion;window.beginTime=beginTime;window.finalScreen=finalScreen;window.resetGame=resetGame;home();
</script></body></html>
